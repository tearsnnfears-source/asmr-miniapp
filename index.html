<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0F">
<title>ASMR.LEAKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Take the full height before anything paints, so the loading screen
  // does not jump when the window grows (initTelegram repeats this).
  try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.expand(); } catch (_) {}
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
  // Mobile devtools panel — opt-in with ?debug=1 in the URL. Useful for
  // inspecting console + network requests inside the Telegram WebView.
  (function () {
    try {
      var qs = new URLSearchParams(location.search);
      if (qs.get('debug') !== '1') return;
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = function () { try { window.eruda && window.eruda.init(); } catch (_) {} };
      document.head.appendChild(s);
    } catch (_) {}
  })();
</script>
<style>
  /* Default Telegram safe-area vars — overwritten by api.jsx
     applySafeAreaVars() once the WebApp object reports real insets. The
     env(safe-area-inset-*) fallback covers iOS notch / home indicator in
     a regular browser (preview URLs). */
  :root {
    --tg-safe-top:    env(safe-area-inset-top,    0px);
    --tg-safe-bottom: env(safe-area-inset-bottom, 0px);
    --tg-safe-left:   env(safe-area-inset-left,   0px);
    --tg-safe-right:  env(safe-area-inset-right,  0px);
  }
  html, body {
    margin: 0; padding: 0;
    background: #0E0E0F; color: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    height: 100%; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  #root { height: 100%; width: 100%; }
  * { box-sizing: border-box; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  * { scrollbar-width: none; }
  button { font-family: inherit; }
  input { -webkit-appearance: none; appearance: none; }

  /* Static splash. Renders before any React JS — so users never see the
     mock-data fallback flash. App hides it only after real data is ready. */
  #static-splash {
    position: fixed; inset: 0; z-index: 100000;
    background: #0E0E0F;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
    /* No padding-top here on purpose: it was being driven by
       --tg-safe-top, which is empty on the very first paint and gets
       backfilled once Telegram replies — causing the logo to jump
       downward mid-load. Logo is centered, the chrome doesn't overlap
       the middle, so we don't need the reservation. */
    transition: opacity 250ms ease-out;
  }
  #static-splash.is-leaving { opacity: 0; pointer-events: none; }
  #static-splash .logo {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    font-size: 42px; letter-spacing: 3px; line-height: 1;
    color: #fff;
  }
  #static-splash .logo .accent { color: #FF7EC8; }
  #static-splash .spin {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #FF7EC8;
    border-radius: 50%;
    animation: spl-spin 0.7s linear infinite;
  }
  #static-splash .slow-load {
    display: none;
    text-align: center;
    color: rgba(255,255,255,0.72);
    font-size: 12px;
    line-height: 1.45;
  }
  #static-splash.is-slow .slow-load { display: block; }
  #static-splash .retry-load {
    margin-top: 12px;
    min-width: 112px;
    min-height: 38px;
    border: 1px solid rgba(255,126,200,0.55);
    border-radius: 8px;
    background: rgba(255,126,200,0.1);
    color: #FF7EC8;
    font-size: 12px;
    font-weight: 700;
  }
  @keyframes spl-spin { to { transform: rotate(360deg); } }

  /* Redesign beta loading screen (asmr.ui = v2, set by app.jsx for testers). */
  #static-splash.v2 {
    gap: 0;
    background:
      radial-gradient(60% 40% at 50% 44%, rgba(255,126,200,0.16), rgba(255,126,200,0) 70%),
      radial-gradient(70% 30% at 50% 100%, rgba(200,255,68,0.07), rgba(200,255,68,0) 70%),
      #0E0E0F;
  }
  #static-splash .v2-word {
    display: flex; align-items: center; gap: 4px; padding-top: 4px;
    animation: v2-rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    font-family: 'Bebas Neue', system-ui, sans-serif; font-size: 42px; letter-spacing: 3.5px; line-height: 1; color: #F1F1F1;
  }
  #static-splash .v2-word svg { width: 19px; height: 22px; margin: 0 2px 5px 0; fill: #FF7EC8; }
  #static-splash .v2-tag { margin-top: 10px; font-size: 14px; color: #AAAAAA; animation: v2-rise 0.6s 0.08s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  #static-splash .v2-bar {
    position: relative; width: 140px; height: 4px; margin-top: 30px;
    border-radius: 2px; overflow: hidden; background: rgba(255,255,255,0.1);
    animation: v2-rise 0.6s 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  #static-splash .v2-bar span {
    position: absolute; left: 0; top: 0; width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #FF7EC8, #C8FF44); animation: v2-bar 1.4s ease-in-out infinite;
  }
  #static-splash.v2 .slow-load { margin-top: 28px; }
  @keyframes v2-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes v2-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* Immersive video — applied by player.jsx toggleFullscreen. Pin the
     player wrap to the whole viewport on top of the app chrome. Works
     even when the native Fullscreen API is blocked (iOS in Telegram). */
  .vp-immersive {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 9500 !important;
    background: #000 !important;
    border-radius: 0 !important;
    aspect-ratio: auto !important;
  }
  .vp-immersive video {
    width: 100vw !important;
    height: 100vh !important;
    object-fit: contain !important;
  }
  @media (orientation: portrait) {
    /* On a vertical phone, lay the player on its side so the video gets
       the long edge of the screen even when we can't lock orientation. */
    .vp-immersive.vp-force-landscape {
      width: 100vh !important;
      height: 100vw !important;
      transform-origin: top left !important;
      transform: rotate(90deg) translateY(-100%) !important;
    }
  }
</style>
</head>
<body>
<div id="static-splash">
  <div class="logo">ASMR<span class="accent">.LEAKS</span></div>
  <div class="spin"></div>
  <div class="slow-load">
    Connection is taking longer than usual.<br>
    <button class="retry-load" type="button" onclick="location.reload()">Retry</button>
  </div>
</div>
<script>
  // Testers who saw the redesign last time get its loading screen right away.
  (function () {
    try {
      var forced = new URLSearchParams(location.search).get('ui');
      var v2 = forced === 'v2' || (forced !== 'v1' && localStorage.getItem('asmr.ui') === 'v2');
      if (!v2) return;
      var el = document.getElementById('static-splash');
      var drop = '<svg viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1 L32.38 24.47 A14 14 0 1 1 7.62 24.47 Z"/></svg>';
      var slow = el.querySelector('.slow-load');
      el.classList.add('v2');
      el.innerHTML = '<div class="v2-word">ASMR' + drop + 'LEAKS</div>'
        + '<div class="v2-tag">Exclusive ASMR archive</div>'
        + '<div class="v2-bar"><span></span></div>';
      if (slow) el.appendChild(slow);
    } catch (_) {}
  })();
  // Hide hook that AppShell calls once real data lands.
  window.__hideSplash = function () {
    var el = document.getElementById('static-splash');
    if (!el) return;
    el.classList.add('is-leaving');
    setTimeout(function () { el && el.remove && el.remove(); }, 300);
    window.__hideSplash = function () {}; // idempotent
  };
  // Never reveal an empty shell. If startup really stalls, keep the splash
  // and offer a retry; successful late data can still call __hideSplash().
  setTimeout(function () {
    var el = document.getElementById('static-splash');
    if (el) el.classList.add('is-slow');
  }, 15000);
</script>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="crypto-checkout.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="api.jsx"></script>
<script type="text/babel" src="debug.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="player.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="library.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
